name: Build & Release iOS

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布版本号 (如 v1.0.0)"
        required: true
        default: "v1.0.0"

env:
  RELEASE_TAG: ${{ github.event.inputs.tag_name }}

jobs:
  build-ios:
    name: Build iOS IPA (Sideload)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter and locked dependencies
        uses: ./.github/actions/setup-flutter

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS (No Codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=COPY_AUTH_KEY=${{ secrets.COPY_AUTH_KEY }}

      - name: Package to IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          OUT="kira-${RELEASE_TAG}-ios-unsigned.ipa"
          zip -r -q "$OUT" Payload
          rm -rf Payload
          ls -lh "$OUT"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: ios-ipa
          path: build/ios/ipa/kira-*.ipa

  release:
    name: Create Release
    needs: [build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: docs/CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES_ARGS=()
          if [ -f docs/CHANGELOG.md ]; then
            NOTES_ARGS=(--notes-file docs/CHANGELOG.md)
          else
            NOTES_ARGS=(--generate-notes)
          fi
          mapfile -t FILES < <(find artifacts -type f)
          gh release create "$RELEASE_TAG" "${FILES[@]}" \
            --repo="$GITHUB_REPOSITORY" \
            --title="App $RELEASE_TAG" \
            "${NOTES_ARGS[@]}"
